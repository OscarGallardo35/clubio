<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #E63946;
        color: #fff;
      }
      h1 { font-size: 22px; margin: 0; }
      p { margin: 0; opacity: .9; max-width: 32ch; }
      button {
        margin-top: 8px;
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #E63946;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Sin conexión</h1>
    <p>No pudimos conectarnos. Revisá tu internet y volvé a intentarlo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </body>
</html>
